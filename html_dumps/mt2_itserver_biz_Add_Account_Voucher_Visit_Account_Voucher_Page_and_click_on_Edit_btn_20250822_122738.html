        document.getElementById("YumUserLogin_username").focus();

const togglePassword = document.querySelector("#togglePassword");
const YumUserLogin_password = document.querySelector("#YumUserLogin_password");

togglePassword.addEventListener("click", function () {
    // toggle the type attribute
    const type = YumUserLogin_password.getAttribute("type") === "password" ? "text" : "password";
    const classToSet = YumUserLogin_password.getAttribute("type") === "password" ? "fa-eye" : "fa-eye-slash";
    YumUserLogin_password.setAttribute("type", type);
    
    // toggle the icon
	this.classList.remove('fa-eye-slash');
	this.classList.remove('fa-eye');
	this.classList.add(classToSet);
});
</script>

<script>
	document.getElementById("YumUserLogin_username").addEventListener("keyup", disableRememberMe);
	var rememberMe = document.getElementById('YumUserLogin_rememberMe');

	function disableRememberMe(e) {
		if (e.target.value.startsWith('cl_')) {
			rememberMe.checked = false;
			rememberMe.disabled = true;
		}
		else {
			rememberMe.disabled = false;
		}
	}
</script>
